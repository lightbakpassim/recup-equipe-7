<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Récup’ — le tableau du campus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="stage">
    <aside class="pitch">
      <p class="pitch-kicker">ESIG Tech Arena 2026</p>
      <h1>Récup’</h1>
      <p class="pitch-tag">Le tableau du campus pour retrouver ce que tu as perdu, et emprunter ce qu’il te manque.</p>
      <ul class="pitch-list">
        <li>Trouvé</li>
        <li>Perdu</li>
        <li>Prêt</li>
      </ul>
      <p class="pitch-hint">Parcours démo : badge à la cafet → « C’est à moi » → RDV BU.</p>
    </aside>

    <div class="phone">
      <div class="phone-bar">
        <span>Récup’</span>
        <span class="phone-time" id="clock">12:14</span>
      </div>
      <main id="app" class="app"></main>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
